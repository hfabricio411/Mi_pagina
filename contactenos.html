<section class="contacto-section">
<div class="contacto-container">
    
    <!-- Texto alineado a la izquierda -->
    <div class="contacto-texto">
    <h1>¡Reserva tu cita<br>ahora mismo!</h1>
    </div>

    <!-- Caja del formulario alineada a la derecha -->
    <div class="contacto-form-card">
    <form action="#" method="POST">
        
        <div class="form-group">
        <label for="telefono">Teléfono / whatsapp</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu teléfono">
        </div>

        <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
        <label for="procedimiento">Procedimiento</label>
        <select id="procedimiento" name="procedimiento">
            <option value="invisalign">Odontología General</option>
            <option value="limpieza">Blanqueamiento Dental con Láser</option>
            <option value="blanqueamiento">Ortodoncia</option>
            <option value="blanqueamiento">Blanqueamiento Dental con Ozono</option>
            <option value="blanqueamiento">Radiología Oral</option>
            <option value="blanqueamiento">Rehabilitación Oral</option>
        </select>
        </div>

        <div class="form-group">
        <label for="horario">Mejor momento para ponerse en contacto:</label>
        <select id="horario" name="horario">
            <option value="9-11">9:00 a 11:00</option>
            <option value="11-13">11:00 a 13:00</option>
            <option value="15-18">13:00 a 15:00</option>
            <option value="15-18">15:00 a 17:00</option>
            <option value="15-18">17:00 a 19:00</option>
        </select>
        </div>
        <button type="submit" class="btn-enviar">Enviar</button>
    </form>
    </div>

</div>
</section>
